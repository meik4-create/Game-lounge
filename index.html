<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spiele-Lounge</title>
<meta name="theme-color" content="#dfe7ff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap">
<style>
:root{--bg1:#dfe7ff;--bg2:#dfe7ff;--card:#ffffff;--text:#1a1b3a;--muted:#555a85;--line:#d3daf5;--acc:#4b32e0;--acc2:#4b32e0;--board:#3b5bdb;--hole:#e8edfc;--field:#f1f4ff;--ink:#1a1b3a;--shd:#1a1b3a;--dot:#1a1b3a1c;--pop:#ffcf33;--p0:#e5383b;--p1:#f6b800;--p2:#2a9d4a;--p3:#2b8cdc;--p4:#8e44ad;--p5:#f07f13;--sh:3px 5px 0 var(--shd);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#0e1124;--bg2:#0e1124;--card:#1a1e3c;--text:#eef0ff;--muted:#a3a8d6;--line:#2c3260;--acc:#a99cff;--acc2:#a99cff;--board:#2e4aa8;--hole:#10132a;--field:#121634;--ink:#4a52a8;--shd:#04050c;--dot:#ffffff12;--pop:#ffcf33}}
:root[data-theme="dark"]{--bg1:#0e1124;--bg2:#0e1124;--card:#1a1e3c;--text:#eef0ff;--muted:#a3a8d6;--line:#2c3260;--acc:#a99cff;--acc2:#a99cff;--board:#2e4aa8;--hole:#10132a;--field:#121634;--ink:#4a52a8;--shd:#04050c;--dot:#ffffff12;--pop:#ffcf33}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:linear-gradient(160deg,var(--bg1),var(--bg2));color:var(--text);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:500px;margin:0 auto;padding:18px 14px 40px;text-align:center}
h1{margin:8px 0 2px;font-size:2rem;letter-spacing:-.02em}
h1 span{background:linear-gradient(90deg,#5b5bf0,#e5383b);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub,.code{color:var(--muted);margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--sh);margin-bottom:14px}
.btn{display:block;width:100%;background:var(--acc);color:#fff;border:0;border-radius:12px;padding:13px;font:inherit;font-weight:600;margin:8px 0;cursor:pointer;transition:transform .1s}
.btn:active{transform:scale(.97)}.btn.alt{background:transparent;color:var(--text);border:1px solid var(--line)}
input,select{background:var(--bg1);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit;width:100%}
.join{display:flex;gap:8px;margin:8px 0}.join input{text-transform:uppercase;letter-spacing:.2em;text-align:center}.join .btn{width:auto;margin:0;padding:12px 18px}
section{display:none}
.chip{display:inline-block;background:var(--bg1);border:1px solid var(--line);border-radius:999px;padding:5px 14px;font-weight:700;letter-spacing:.2em;margin:2px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 8px;font:inherit;color:var(--text);cursor:pointer;box-shadow:var(--sh);transition:transform .1s}
.tile:active{transform:scale(.96)}.tile b{display:block;font-size:2rem}.tile small{color:var(--muted)}
#status{font-weight:700;font-size:1.1rem;min-height:1.6em;margin:4px 0 12px}
.dot{display:inline-block;width:.85em;height:.85em;border-radius:50%;margin-right:5px;vertical-align:-1px;background:currentColor}
.g{display:grid;gap:6px;padding:8px;border-radius:16px;background:var(--board);box-shadow:var(--sh);touch-action:manipulation}
.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g7{grid-template-columns:repeat(7,1fr)}.g8{grid-template-columns:repeat(8,1fr);gap:3px;padding:5px}
.c{aspect-ratio:1;background:var(--hole);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.9rem;cursor:pointer;color:#222}
.g7 .c{border-radius:50%}.g8 .c{font-size:.9rem;border-radius:5px}.c.dn{opacity:.35}.c.sp{background:#2c3e5c}
@keyframes pop{from{transform:scale(.6)}to{transform:scale(1)}}
.p0{background:var(--p0)}.p1{background:var(--p1)}.p2{background:var(--p2)}.p3{background:var(--p3)}.p4{background:var(--p4)}.p5{background:var(--p5)}
.nim{display:flex;gap:5px;justify-content:center;margin:12px 0}.nim span{font-size:2rem;cursor:pointer}
.score{margin:8px 0;color:var(--muted)}.big{font-size:2.6rem;font-weight:800;margin:6px 0}
.row{display:flex;gap:8px;margin-top:14px}.row .btn{margin:0}
.lbl{font-size:.85rem;color:var(--muted);margin:10px 0 4px}
svg{width:100%;max-width:340px}.mv{stroke:#fff;stroke-width:3;cursor:pointer;animation:pulse .8s infinite alternate}
@keyframes pulse{to{stroke-width:5}}
#sb h3{margin:0 0 8px;font-size:1rem}.sbr{display:flex;justify-content:space-between;padding:5px 2px;border-top:1px solid var(--line)}
.c.win{outline:4px solid #fff;animation:pulse2 .6s infinite alternate}.c.lm{box-shadow:inset 0 0 0 3px #fff9}@keyframes pulse2{to{outline-color:transparent}}
.mini{background:var(--bg1);border:1px solid var(--line);color:var(--text);border-radius:999px;padding:8px 14px;font:inherit;font-size:.85rem;margin:8px 4px 0;cursor:pointer}
.toast{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 18px;border-radius:999px;z-index:9}
.cf{position:fixed;top:-14px;width:9px;height:14px;z-index:9;animation:fall 2.4s linear forwards}@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}
section{animation:fade .3s}@keyframes fade{from{opacity:0;transform:translateY(8px)}}
.tile{animation:pop .35s backwards}
#status.my{animation:glow 1.1s infinite alternate;color:var(--acc)}@keyframes glow{to{opacity:.55}}
.g7 .c.lm{animation:drop .45s cubic-bezier(.3,1.5,.5,1)}@keyframes drop{from{transform:translateY(-260%)}}
.g3 .c.lm{animation:pop .25s}.c.up{animation:flip .35s}@keyframes flip{from{transform:rotateY(90deg)}}
.die{font-size:3.6rem;display:inline-block;line-height:1}.roll{animation:spin .5s}@keyframes spin{from{transform:rotate(-360deg) scale(.3)}}
text.roll{transform-box:fill-box;transform-origin:center}
g.mv{cursor:pointer}g.mv circle,g.mv path{stroke:#ffe14d;stroke-width:3.5;animation:pulse .8s infinite alternate}
.land{animation:land .5s;transform-box:fill-box;transform-origin:center}@keyframes land{from{transform:scale(2.3);opacity:.4}}
svg{overflow:visible}.stage{perspective:1000px}.tilt{transform:rotateX(46deg) scale(.95);transform-origin:50% 55%;margin:-34px 0 -30px;transition:transform .5s;filter:drop-shadow(0 16px 12px rgba(0,0,0,.35))}.tilt svg{display:block;margin:auto}.flat .tilt{transform:none;margin:0;filter:none}
.cw{perspective:420px;width:62px;height:62px;margin:16px auto 8px}.cube{width:62px;height:62px;position:relative;transform-style:preserve-3d;transform:var(--t)}.cube.go{animation:tumble .9s cubic-bezier(.2,.8,.2,1)}
@keyframes tumble{from{transform:rotateX(540deg) rotateY(720deg) rotateZ(90deg)}}
.f{position:absolute;inset:0;display:grid;place-items:center;background:#fff;color:#111;border:2px solid #c9ccd8;border-radius:11px;font-size:46px;font-style:normal;backface-visibility:hidden}
.f1{transform:translateZ(31px)}.f2{transform:rotateY(90deg) translateZ(31px)}.f3{transform:rotateX(90deg) translateZ(31px)}.f4{transform:rotateX(-90deg) translateZ(31px)}.f5{transform:rotateY(-90deg) translateZ(31px)}.f6{transform:rotateY(180deg) translateZ(31px)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.rl{background:var(--bg1);border-radius:12px;padding:10px 12px;margin:0 0 10px;font-size:.9rem;color:var(--muted);text-align:left}
.fe{position:fixed;bottom:70px;font-size:2.6rem;z-index:8;pointer-events:none;animation:rise 2.1s ease-out forwards;text-align:center}.fe small{display:block;font-size:.7rem;color:var(--muted)}
@keyframes rise{to{transform:translateY(-55vh) scale(1.4);opacity:0}}
.mb{display:grid;grid-template-columns:repeat(11,1fr);grid-template-rows:repeat(11,1fr);gap:1px;background:var(--line);border-radius:12px;overflow:hidden;aspect-ratio:1}
.sq{background:var(--card);position:relative;font-size:.62rem;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;line-height:1.1;min-width:0}
.cb{position:absolute;top:0;left:0;right:0;height:24%}.tk{width:9px;height:9px;border-radius:50%;border:1.5px solid #fff;display:inline-block;margin:0 1px;box-shadow:0 1px 2px #0006}
.ctr{grid-area:2/2/11/11;background:var(--bg1);padding:6px;overflow:auto;font-size:.78rem;display:flex;flex-direction:column;gap:4px;align-items:center;justify-content:center;text-align:center}
.ctr .btn{padding:8px 10px;margin:2px 0;font-size:.82rem}
.rv{background:#2e7d4f}.rv .c{background:#3a8f5d}.ds{display:flex;align-items:center;justify-content:center;font-style:normal;color:#222;font-size:1.1rem;width:78%;height:78%;border-radius:50%;box-shadow:0 2px 3px #0005}
.hn{width:24%;height:24%;border-radius:50%;background:#fff7}.c.lt{background:#e8d5b0;cursor:default}.c.dkc{background:#8b5a2b}.c.sl{box-shadow:inset 0 0 0 3px #fff}
.kt{width:100%;border-collapse:collapse;font-size:.78rem;margin-top:8px}.kt td,.kt th{border-top:1px solid var(--line);padding:4px 2px}.kt td.cl{cursor:pointer;color:var(--acc);font-weight:700}
.dc{display:flex;gap:6px;justify-content:center;margin:8px 0}.dc span{font-size:2.6rem;line-height:1.1;cursor:pointer;border-radius:10px;padding:0 4px}.dc span.kp{background:var(--acc);color:#fff}
.uc{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;min-width:42px;height:60px;border-radius:9px;color:#fff;font-weight:800;font-size:1.2rem;margin:3px;border:2px solid #fff;box-shadow:0 2px 5px #0004;cursor:pointer}
.uc.big{width:70px;height:98px;font-size:2rem;margin:8px auto;cursor:default}.uc.dim{opacity:.45}.uh{display:flex;flex-wrap:wrap;justify-content:center;gap:2px}
.wc{display:flex;gap:3px;margin-top:3px}.wc i{width:16px;height:16px;border-radius:50%;border:1px solid #fff}
.kb{display:inline-block;width:34px;margin:2px;padding:7px 0;border:1px solid var(--line);border-radius:8px;cursor:pointer;background:var(--bg1)}.kb.us{opacity:.3;cursor:default}
.pc{display:inline-block;width:32px;height:32px;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 3px #0005;margin:3px;cursor:pointer}

/* ===== Design v2: Spieleabend ===== */
html{background:var(--bg1)}
body{background-color:var(--bg1);background-image:radial-gradient(var(--dot) 1.6px,transparent 1.8px);background-size:24px 24px;font:600 16px/1.45 "Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:hidden}
main{padding-top:58px}
section,.tile{animation:none}
:focus-visible{outline:3px solid var(--acc);outline-offset:3px}
h1{margin:10px 0 0;line-height:1}
.logo{display:flex;flex-direction:column;align-items:center;gap:8px}
.logo .w{display:flex;gap:5px}
.logo i{font-style:normal;width:clamp(40px,11.5vw,54px);aspect-ratio:1;display:grid;place-items:center;background:var(--c);color:var(--tc,#fff);border:3px solid var(--ink);border-radius:12px;box-shadow:2px 4px 0 var(--shd);font:700 clamp(1.5rem,7vw,2.1rem)/1 "Fredoka","Baloo 2","Trebuchet MS",system-ui,sans-serif;transform:rotate(var(--r,0deg));animation:tiledrop .6s cubic-bezier(.3,1.6,.5,1) backwards;animation-delay:calc(var(--i)*60ms)}
@keyframes tiledrop{from{transform:translateY(-110px) rotate(calc(var(--r,0deg) + 50deg));opacity:0}}
.sub{font-weight:700;color:var(--muted);margin:16px 0 18px}
.card{background:var(--card);border:3px solid var(--ink);border-radius:22px;box-shadow:var(--sh);padding:16px;margin-bottom:18px;backdrop-filter:none;-webkit-backdrop-filter:none}
.btn{font:600 1.08rem "Fredoka","Baloo 2","Trebuchet MS",system-ui,sans-serif;letter-spacing:0;background:var(--pop);color:#1a1b3a;border:3px solid var(--ink);border-radius:16px;box-shadow:0 5px 0 var(--ink);padding:12px;margin:10px 0 14px;transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn.alt{background:var(--card);color:var(--text);border:3px solid var(--ink)}
.join{gap:10px;margin:8px 0 14px}.join .btn{margin:0 0 5px;padding:12px 18px}
.row{gap:10px}.row .btn{margin:0 0 5px;flex:1 1 0;min-width:0;width:auto;padding:11px 2px;font-size:.88rem}
input,select{background:var(--field);color:var(--text);border:3px solid var(--ink);border-radius:14px;font:700 1rem "Nunito",system-ui,sans-serif;outline:none}
input:focus,select:focus{border-color:var(--acc);box-shadow:none}
input::placeholder{color:var(--muted);opacity:.8}
.join input{font-family:"Fredoka","Trebuchet MS",sans-serif}
.chip{border:2px solid var(--ink);box-shadow:none;background:var(--pop);color:#1a1b3a}
.chip2{display:inline-block;background:var(--field);border:2px solid var(--ink);border-radius:999px;padding:4px 14px;margin:3px;font-weight:700}
.mini{background:var(--card);border:2px solid var(--ink);color:var(--text);border-radius:999px;box-shadow:0 3px 0 var(--ink);min-height:40px;padding:6px 14px;font-weight:700;margin:8px 5px 4px;transition:transform .08s,box-shadow .08s}
.mini:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.tools{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));right:8px;z-index:5;display:flex;gap:6px}
.tools .mini{margin:0;width:44px;height:44px;padding:0;font-size:1.2rem}
.stats{margin:-4px 0 10px}
.gg{display:flex;align-items:center;gap:10px;margin:22px 2px 10px;font:700 1.15rem "Fredoka","Trebuchet MS",sans-serif;text-align:left}
.gg::after{content:"";flex:1;height:3px;border-radius:2px;background:var(--ink);opacity:.2}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 0 6px}
.tiles .tile:last-child:nth-child(odd){grid-column:1/-1}
.tile{position:relative;background:var(--c,#3b5bdb);color:#fff;border:3px solid var(--ink);border-radius:18px;box-shadow:0 5px 0 var(--ink);padding:14px 8px 12px;min-height:118px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-shadow:none;font:600 1.02rem/1.15 "Fredoka","Trebuchet MS",system-ui,sans-serif;transition:transform .08s,box-shadow .08s}
.tile:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.tile b{font-size:2.4rem;line-height:1.15;margin:0 0 2px;filter:drop-shadow(0 3px 0 #0003)}
.tile small{font:700 .78rem "Nunito",system-ui,sans-serif;background:#00000030;color:#fff;border-radius:999px;padding:2px 10px;margin-top:7px}
.gh{font:700 1.3rem "Fredoka","Trebuchet MS",sans-serif;margin:0 0 10px}
#status{display:inline-block;background:var(--field);padding:8px 18px;border-radius:999px;border:3px solid var(--ink);font:600 1rem "Fredoka","Trebuchet MS",sans-serif;margin:2px 0 14px}
#status.my{background:var(--pop);color:#1a1b3a}
#sb h3{font:700 1.1rem "Fredoka","Trebuchet MS",sans-serif;margin:0 0 6px}
.sbr{padding:8px 4px}.sbr b{background:var(--field);border:2px solid var(--ink);border-radius:999px;padding:1px 12px}
.rl{border:2px dashed var(--ink);background:var(--field);color:var(--text)}
.toast{background:var(--ink);color:#fff;border:2px solid #fff3;font-weight:700}
.g{border:3px solid var(--ink);border-radius:20px;box-shadow:var(--sh)}
/* Tic Tac Toe */
.g3{background:transparent;border:0;box-shadow:none;gap:10px;padding:0}
.g3 .c{background:var(--card);border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);font-size:2.8rem;border-radius:18px;color:var(--text)}
.g3 .c.win{background:#fff3b0;color:#1a1b3a}
/* Vier gewinnt */
.g7{background:linear-gradient(180deg,#4468e8,#2a47b8);box-shadow:inset 0 -6px 0 #1b2f8c,var(--sh);gap:7px;padding:10px}
.g7 .c{background:radial-gradient(circle at 50% 35%,#0e1a4a,#1a2c70);box-shadow:inset 0 4px 8px #000a}
.g7 .c.p0{background:radial-gradient(circle at 35% 30%,#ff9a9c,#e5383b 55%,#a31d20);box-shadow:inset 0 -3px 5px #0005}
.g7 .c.p1{background:radial-gradient(circle at 35% 30%,#fff1a8,#f6b800 55%,#b58300);box-shadow:inset 0 -3px 5px #0005}
/* Memory */
.g4{background:transparent;border:0;box-shadow:none;gap:9px;padding:0}
.g4 .c{background:linear-gradient(135deg,#8a5cff,#5b8cff);color:#fff;border:3px solid var(--ink);border-radius:14px;font-size:1.7rem;box-shadow:0 4px 0 var(--ink)}
.g4 .c.up{background:#fff;color:#111}.g4 .c.dn{background:#d9f7e4;color:#111;opacity:.75}
/* Reversi, Dame, Schiffe */
.ds{background-image:radial-gradient(circle at 32% 28%,rgba(255,255,255,.55),rgba(255,255,255,0) 55%)}
.g8{background:#14577f}.g8 .c{background:#3a9ad9;border-radius:6px}.g8 .c.sp{background:#26364d}
.g8.rv{background:linear-gradient(135deg,#2e8b57,#1b5e3b)}.g8.rv .c{background:#3a9e66}
.g8:has(.c.dkc){background:#4a2a12}.g8 .c.lt{background:#f0dcb4}.g8 .c.dkc{background:#8b5a2b}
/* Kniffel */
.dc{gap:5px;flex-wrap:wrap}.dc span{background:#fff;color:#111;border:3px solid var(--ink);border-radius:14px;box-shadow:0 4px 0 var(--ink);padding:2px 5px;font-size:2.3rem;transition:transform .15s}
.dc span.kp{background:var(--pop);transform:translateY(-8px)}
.kt tr:nth-child(even) td{background:var(--field)}.kt td.cl{background:#4b32e022!important;border-radius:6px}
/* UNO */
.uc{position:relative;overflow:hidden;border-radius:13px;font-size:1.45rem;text-shadow:0 2px 3px #0006;box-shadow:0 5px 0 #0005}
.uc::after{content:"";position:absolute;inset:0;background:linear-gradient(160deg,rgba(255,255,255,.3),rgba(0,0,0,.14));pointer-events:none}.wc{position:relative;z-index:1}
/* Monopoly, Mensch ärgere dich nicht */
.mb{border:3px solid var(--ink);border-radius:18px;box-shadow:var(--sh)}.ctr{background:var(--field)}.sq{transition:background .2s}
/* Galgenmännchen, Montagsmaler */
.kb{border:2px solid var(--ink);border-radius:10px;font-weight:700;box-shadow:0 3px 0 var(--ink)}.pc{box-shadow:0 2px 6px #0004}
/* Siegesmoment */
#fx{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;z-index:20}
.sticker{background:var(--pop);color:#1a1b3a;border:4px solid var(--ink);border-radius:26px;box-shadow:0 8px 0 var(--ink);padding:16px 28px 18px;text-align:center;font:700 1.7rem/1.15 "Fredoka","Trebuchet MS",sans-serif;max-width:86vw;animation:stick 2.7s both}
.sticker .bg{display:block;font-size:3.6rem;line-height:1.15}
.sticker small{display:block;font:700 .95rem "Nunito",system-ui,sans-serif;margin-top:6px}
@keyframes stick{0%{transform:scale(.2) rotate(-14deg);opacity:0}10%{transform:scale(1.14) rotate(3deg);opacity:1}18%{transform:scale(1) rotate(-2deg)}85%{transform:scale(1) rotate(-2deg);opacity:1}100%{transform:scale(.92) rotate(-2deg) translateY(30px);opacity:0}}
.cf{border-radius:var(--br,2px);animation:fall var(--du,2.6s) cubic-bezier(.3,.2,.6,1) forwards}
@keyframes fall{to{transform:translate(var(--dx,0),105vh) rotate(var(--rt,720deg))}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
